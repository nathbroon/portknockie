 {k:'music',l:'Music',tog:1},
 {k:'track',l:'Track',o:()=>[['shuffle','Shuffle all'],...TUNES.map(t=>[t.id,t.name])]},
 {np:1},
 {k:'mvol',l:'Music volume',rng:1},{k:'svol',l:'Sound effects',rng:1},{k:'avol',l:'Sea, gulls & weather',rng:1},
 {sec:'Gameplay'},
 {k:'shift',l:'Shift length',o:()=>[['short','Short (2 min)'],['standard','Standard (2½ min)'],['long','Long (4 min)']]},
 {k:'diff',l:'Pace',h:'Brisk pays 15% more',o:()=>[['gentle','Gentle'],['standard','Standard'],['brisk','Brisk']]},
 {k:'stack',l:'Stack taps into a route',h:'Each tap adds a stop; ✖ clears',tog:1},
 {k:'haptics',l:'Vibrate on deliveries',tog:1},
 {sec:'Display'},
 {k:'labels',l:'Place names',tog:1},{k:'minimap',l:'Minimap',tog:1},{k:'arrow',l:'Guide arrow',tog:1},{k:'pathline',l:'Show route line',tog:1},
 {k:'currency',l:'Money',o:()=>[['lsd','£sd (1953)'],['dec','Decimal (£0.00)']]},{k:'clock',l:'Clock',o:()=>[['12','12-hour'],['24','24-hour']]},
 {k:'bigtext',l:'Larger text',tog:1},{k:'motion',l:'Animated weather & waves',tog:1},{k:'quality',l:'Graphics',o:()=>[['high','Sharp'],['battery','Battery saver']]},
 {sec:'About'},{about:1},
 {sec:'Data'},{reset:1},
];
function showSettings(back){const prev=mode;if(mode!=='pause')mode='settings';
  const s=set();let html='<h2>Settings</h2><div class="rule"></div>';
  for(const r of SETS){if(r.sec){html+=`<div class="sec">${r.sec}</div>`;continue;}
    if(r.np){html+=`<div class="np">♫ <span>Now playing: <b id="npName">—</b></span><button class="chip" id="npSkip" style="margin-left:auto">Next ⏭</button></div>`;continue;}
    if(r.about){html+=`<div class="set" data-nodor><p style="margin:0 0 4px"><b>Portknockie: Muckle Helpin Haun</b></p><table class="stat"><tr><td>Developer</td><td>Croftware</td></tr><tr><td>Created by</td><td>Nathan Brown</td></tr><tr><td>Email</td><td><a href="mailto:nathan@croftware.com">nathan@croftware.com</a></td></tr></table><p style="font-size:12px;color:var(--muted);margin-top:8px">© 2026 Croftware. All rights reserved. The village, characters, music and artwork in this game are original works; Portknockie place names and landmarks are used for their local history.</p></div>`;continue;}
    if(r.reset){html+=`<div class="set"><label>Reset all progress</label><button class="buy" style="background:var(--red)" id="rst">Reset…</button><span id="rstc"></span></div>`;continue;}
    if(r.tog){html+=`<div class="set tog"><label>${r.l}</label><button class="sw ${s[r.k]?'on':''}" data-tog="${r.k}" aria-label="${r.l}"></button></div>`;continue;}
    if(r.rng){html+=`<div class="set"><label>${r.l}</label><input type="range" min="0" max="1" step="0.05" value="${s[r.k]}" data-rng="${r.k}"></div>`;continue;}
    html+=`<div class="set"><label>${r.l}${r.h?`<small>${r.h}</small>`:''}</label><div class="seg">${r.o().map(([v,n])=>`<button data-k="${r.k}" data-v="${v}" class="${s[r.k]===v?'on':''}">${n}</button>`).join('')}</div></div>`;}
  openOv(html,`<button class="big" id="done">Done</button>`);refreshNP();
  const sc=ov.querySelector('.scroll'),keep=()=>{const y=sc.scrollTop;showSettings(back);ov.querySelector('.scroll').scrollTop=y;};
  ov.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{audioInit();s[b.dataset.k]=b.dataset.v;save();applySettings(b.dataset.k);keep();});
  ov.querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>{audioInit();s[b.dataset.tog]=!s[b.dataset.tog];save();applySettings(b.dataset.tog);keep();});
  ov.querySelectorAll('[data-rng]').forEach(b=>b.oninput=()=>{audioInit();s[b.dataset.rng]=+b.value;save();applyVol();});
  $('npSkip').onclick=()=>{audioInit();if(!s.music){s.music=true;save();applyVol();}musicNext();setTimeout(refreshNP,50);};
  $('rst').onclick=()=>{$('rstc').innerHTML=' <button class="buy" style="background:var(--red)" id="rst2">Yes, erase everything</button>';$('rst2').onclick=()=>{const keepSet=SV.set;SV={earned:0,purse:0,jobs:{},ach:{},floats:[],cards:[],kit:{},vil:{},daily:null,streak:0,lastDay:'',seenJobs:['paper','post','sweep'],set:keepSet};save();applySeason();mmBase=null;toast('Progress reset');showTitle();};};
  $('done').onclick=()=>{if(prev==='pause'){mode='pause';}back();};}
function applySettings(k){if(k==='lang')document.documentElement.lang=set().lang==='doric'?'sco':'en';if(k==='season'){applySeason();if(set().weather==='auto'&&!S)pickWeather();mmBase=null;}
  if(k==='weather'){if(S||set().weather!=='auto')pickWeather();if(S)S.wx=WX;}
  if(k==='crowd')spawnNPCs();if(k==='quality')resize();if(k==='bigtext')document.body.classList.toggle('bigtext',set().bigtext);
  if(k==='music'){applyVol();if(set().music)musicNext();else musicStop();}if(k==='track'&&set().music)musicNext();}

// ============================================================ boot
document.body.classList.toggle('bigtext',set().bigtext);resize();applySeason();pickWeather();spawnNPCs();daily();
applySettings('lang');showTitle();requestAnimationFrame(frame);
</script>
